services:
  imposition-api:
    build: .
    image: saddle-stitch-imposition:latest
    container_name: saddle-stitch-imposition
    ports:
      # 宿主机端口可用环境变量 HOST_PORT 覆盖，默认 8000
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 容器内监听端口（一般无需修改）
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      # 启动时需要联网安装依赖，给予较长的启动宽限期
      start_period: 60s
